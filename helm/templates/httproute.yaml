{{- if .Values.httproute.enabled -}}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
{{- fail "httproute.enabled=true requires the Gateway API (gateway.networking.k8s.io/v1) CRDs" -}}
{{- end -}}
{{- $fullName := include "otterwiki.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $parentRefs := .Values.httproute.parentRefs | required "httproute.parentRefs is required" -}}
{{- if eq (len $parentRefs) 0 -}}
{{- fail "httproute.parentRefs has to contain at least one gateway reference" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "otterwiki.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  rules:
  {{- if .Values.httproute.rules }}
    {{- range .Values.httproute.rules }}
    - backendRefs:
        - name: {{ $fullName }}
          kind: Service
          port: {{ $svcPort }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- else }}
    - backendRefs:
        - name: {{ $fullName }}
          kind: Service
          port: {{ $svcPort }}
      matches:
      - path:
          type: PathPrefix
          value: /
  {{- end }}
{{- end }}
