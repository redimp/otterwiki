{{- if and .Values.httproute.enabled (semverCompare ">=1.25-0" .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
{{- $fullName := include "otterwiki.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "otterwiki.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
  parentRefs:
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  rules:
  {{- range .Values.httproute.rules }}
    - backendRefs:
        - name: {{ $fulName }}
          kind: Service
          port: {{ $svcPort }}
    {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
{{- end }}
