{% extends "form.html" %}
{% block formcontent %}
<form action="{{ url_for("register") }}" method="POST" class="form-inline">{# <!-- w-400 = width: 40rem (400px), mw-full = max-width: 100% --> #}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="email" class="required w-150">{{ _("eMail Address") }}</label>
    <input type="text" class="form-control" name="email" id="email" placeholder="you@example.com" value="{{email if email}}" autofocus>
  </div>
  <div class="form-group">
    <label for="password1" class="required w-150">{{ _("Password") }}</label>
    <input type="password" class="form-control" name="password1" id="password1" placeholder="{{ _("Password") }}">
  </div>
  <div class="form-group">
    <label for="password2" class="required w-150">{{ _("Confirm password") }}</label>
    <input type="password" class="form-control" name="password2" id="password2" placeholder="{{ _("Confirm Password") }}">
  </div>
  <div class="form-group">
    {{ _("The password must be at least %(num)s characters long.", num=config["PASSWORD_MIN_LENGTH"]) }}
  </div>
  <div class="form-group">
    <label for="name" class="required w-150">{{ _("Name") }}</label>
    <input type="text" class="form-control" name="name" id="name" placeholder="{{ _("First and Last name") }}" value="{{name if name}}">
  </div>
  <input class="btn btn-primary" type="submit" value="{{ _("Register") }}">
  <a href="{{ url_for("login") }}" class="btn btn-link" role="button">{{ _("Login") }}</a>
</form>
{% endblock %}
