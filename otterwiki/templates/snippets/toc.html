{#- vim: set et ts=8 sts=4 sw=4 ai: -#}
{% if toc -%}
    <details class="collapse-panel" open>
        <summary class="collapse-header">
            {{ _("On this page") }}
{%- set language_badge = content_language_badge(pagepath) %}
{%- if language_badge %}
            <span class="language-badge" title="{{ _("This page is in %(language)s", language=language_badge.name) }}">{{ language_badge.tag }}</span>
{%- endif %}
        </summary>

        <div class="collapse-content">
            {% for count, html, level, text, anchor in toc %}
            <a href="#{{anchor}}" class="sidebar-link sidebar-toc-{{level}}{%if loop.first%} sidebar-active{% endif %}">{{text}}</a>
            {% endfor %}
        </div>
    </details>
{%- endif %}
